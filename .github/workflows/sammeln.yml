name: Ausbildungsbetriebe sammeln

on:
  schedule:
    # Täglich 04:17 UTC. Krumme Minute mit Absicht: zur vollen Stunde starten
    # sehr viele Actions-Jobs gleichzeitig, das kostet Wartezeit.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ausbildungsbetriebe-sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Erst prüfen, dann sammeln: ein kaputter Abgleich würde sonst
      # fehlerhafte Daten in den Bestand schreiben, und der wächst nur.
      - name: Tests
        run: node --test test/*.test.mjs

      - name: Sammellauf
        run: node src/sammeln.mjs

      - name: Neue Betriebe committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten
          if git diff --staged --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "Sammellauf $(date -u +%F)"
            git push
          fi
